<div #host class="host"></div>
<app-hud [hud]="hud()" [stageLabel]="stageLabel()" />
@if (!loaded()) {
  <p class="loading" role="status">LOADING {{ loadPercent() }}%</p>
}
@if (stageResult(); as result) {
  <section class="banner" role="status">
    <h2 class="banner-title">DELIVERED!</h2>
    <p class="banner-score">SCORE {{ result.score }}</p>
    <a class="banner-link" routerLink="/">Menu</a>
  </section>
}
@if (gameOver(); as result) {
  <section class="banner" role="status">
    <h2 class="banner-title">GAME OVER</h2>
    <p class="banner-score">SCORE {{ result.score }}</p>
    <div class="banner-actions">
      <button type="button" class="banner-button" data-testid="retry" (click)="retry()">
        Retry
      </button>
      <a class="banner-link" routerLink="/">Menu</a>
    </div>
  </section>
}
<a class="menu-link" routerLink="/">Menu</a>
@if (devTools) {
  <app-dev-overlay [sample]="perf()" />
  <app-tuning-panel (tuningChange)="applyTuning($event)" />
}
